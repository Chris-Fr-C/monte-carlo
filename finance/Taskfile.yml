# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

vars:
  DB_FILE: "{{.TASKFILE_DIR}}/data/fintools.duckdb"
  REF_FILE: "{{.TASKFILE_DIR}}/data/reference.yaml"
  LOG_LEVEL: "INFO"

tasks:
  data:fetch:
    desc: "Get historical data"
    cmds:
      - |
        uv run fintools/scripts/fetch.py --reference "{{.REF_FILE}}" --db "{{.DB_FILE}}"
    silent: false

  data:make-signals:
    desc: "Build historical signals (slow)"
    cmds:
      - |
        LOGURU_LEVEL="{{.LOG_LEVEL}}" uv run fintools/scripts/make_signals.py --reference "{{.REF_FILE}}" --db "{{.DB_FILE}}"
    silent: false


  duckdb:ui:
    desc: Install and launch duckdb ui.
    cmds:
      - |
        echo "You will have to exit the process with ctrl+d to close the ui."
        duckdb -cmd "INSTALL ui; LOAD ui; CALL start_ui();" {{.DB_FILE}}
    silent: false
