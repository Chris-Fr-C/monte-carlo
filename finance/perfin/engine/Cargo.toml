[package]
name = "engine"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
clap = {version="4.6.5", features=["derive"]}
once_cell = "1.21.4"
polars = {version="0.55.2", features=["csv", "sql", "timezones","temporal"]}
rust_decimal = {version="1.42.1"}
rustler = "0.38.0"
sea-orm = {version="2.0.1",features=["with-rust_decimal", "sqlx-sqlite", "runtime-tokio-native-tls"]}
ta = "0.5.0"
tokio = {version="1.53.1", features=["full"]}
tracing = "0.1.44"
yfinance-rs = "0.9.1"


# For manual run
[[bin]]
name = "engine_cli"
path = "src/main.rs"

# For elixir
[lib]
name = "engine"
crate-type = ["cdylib"]
